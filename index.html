<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ember Constellation Atlas</title>
    <script src="https://d3js.org/d3.v7.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&family=Space+Mono:wght@400;700&display=swap');

        :root {
            --bg-void: #050b14;
            --bg-haze: #0f2033;
            --bg-nebula: #1b3448;
            --text-main: #f3efe2;
            --text-dim: #c2c8cc;
            --accent-gold: #c5ae75;
            --accent-ice: #87c1d9;
            --accent-emerald: #72b8a5;
            --line-base: rgba(140, 169, 188, 0.30);
            --line-active: rgba(232, 211, 160, 0.95);
            --panel-bg: rgba(10, 17, 27, 0.70);
            --panel-border: rgba(197, 174, 117, 0.35);
            --chip-bg: rgba(18, 30, 45, 0.82);
            --chip-border: rgba(135, 193, 217, 0.55);
            --project-star: #f0d8a4;
            --own-project-star: #ff9d00;
            --concept-star: #7cb8aa;
            --category-star: #91b7d6;
        }

        * { box-sizing: border-box; }

        html,
        body {
            width: 100%;
            height: 100%;
            margin: 0;
            overflow: hidden;
            background: var(--bg-void);
            color: var(--text-main);
            font-family: 'Space Mono', ui-monospace, Menlo, monospace;
        }

        #app {
            position: relative;
            width: 100vw;
            height: 100vh;
        }

        #nebula {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
            opacity: 0.8;
        }

        #starfield {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
            opacity: 0.65;
            pointer-events: none;
        }

        #graph {
            position: absolute;
            inset: 0;
            z-index: 2;
            width: 100%;
            height: 100%;
        }

        /* Experience Overlay */
        #overlay {
            position: fixed;
            inset: 0;
            z-index: 100;
            background: radial-gradient(circle at center, var(--bg-nebula), var(--bg-void));
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            transition: opacity 1.2s ease, visibility 1.2s;
        }

        #overlay.hidden {
            opacity: 0;
            visibility: hidden;
        }

        .start-btn {
            font-family: 'Cinzel', serif;
            background: transparent;
            color: var(--accent-gold);
            border: 1px solid var(--accent-gold);
            padding: 18px 36px;
            font-size: 1.2rem;
            letter-spacing: 0.2em;
            cursor: pointer;
            border-radius: 4px;
            transition: all 0.4s ease;
            box-shadow: 0 0 20px rgba(197, 174, 117, 0.1);
        }

        .start-btn:hover {
            background: var(--accent-gold);
            color: var(--bg-void);
            box-shadow: 0 0 40px rgba(197, 174, 117, 0.3);
        }

        .start-hint {
            margin-top: 20px;
            color: var(--text-dim);
            font-size: 0.7rem;
            letter-spacing: 0.1em;
            text-transform: uppercase;
        }

        #audioControl {
            position: absolute;
            bottom: 18px;
            right: 18px;
            z-index: 10;
            pointer-events: auto;
            opacity: 0.6;
            cursor: pointer;
            font-size: 0.8rem;
            color: var(--accent-gold);
            text-decoration: underline;
        }

        #audioControl:hover {
            opacity: 1;
        }

        .hud {
            position: absolute;
            top: 18px;
            left: 18px;
            z-index: 5;
            display: flex;
            flex-direction: column;
            gap: 12px;
            pointer-events: none;
            opacity: 0;
            transform: translateY(-8px);
            transition: opacity 500ms ease, transform 650ms ease;
            max-width: 420px;
        }

        .loaded .hud {
            opacity: 1;
            transform: translateY(0);
        }

        .panel {
            pointer-events: auto;
            border: 1px solid var(--panel-border);
            border-radius: 14px;
            background: var(--panel-bg);
            backdrop-filter: blur(7px);
            box-shadow: 0 14px 35px rgba(0, 0, 0, 0.32);
        }

        .title-panel {
            padding: 14px 16px;
        }

        .title {
            font-family: 'Cinzel', serif;
            letter-spacing: 0.06em;
            margin: 0;
            font-size: clamp(1.05rem, 1.5vw, 1.4rem);
            text-transform: uppercase;
            color: var(--accent-gold);
        }

        .subtitle {
            margin: 6px 0 0;
            color: var(--text-dim);
            font-size: 0.82rem;
            line-height: 1.4;
        }

        .meta {
            margin-top: 10px;
            font-size: 0.73rem;
            color: #8ba1af;
        }

        .control-panel {
            padding: 12px 14px;
            display: flex;
            flex-direction: column;
            gap: 12px;
            width: 420px;
        }

        .view-toggle-group {
            display: flex;
            background: rgba(0, 0, 0, 0.4);
            border-radius: 99px;
            padding: 4px;
            border: 1px solid rgba(135, 193, 217, 0.2);
            width: 100%;
            pointer-events: auto;
        }

        .view-btn {
            flex: 1;
            padding: 8px 12px;
            border-radius: 99px;
            border: none;
            background: transparent;
            color: var(--text-dim);
            font-size: 0.75rem;
            font-family: 'Cinzel', serif;
            letter-spacing: 0.05em;
            cursor: pointer;
            transition: all 300ms cubic-bezier(0.4, 0, 0.2, 1);
        }

        .view-btn.active {
            background: var(--accent-gold);
            color: var(--bg-void);
            font-weight: 700;
            box-shadow: 0 0 15px rgba(197, 174, 117, 0.3);
        }

        .view-btn:hover:not(.active) {
            color: var(--text-main);
            background: rgba(135, 193, 217, 0.1);
        }

        .control-panel input,
        .control-panel select,
        .control-panel button {
            font: inherit;
            border-radius: 9px;
            border: 1px solid rgba(135, 193, 217, 0.35);
            background: rgba(6, 12, 20, 0.82);
            color: var(--text-main);
            padding: 8px 10px;
        }

        .control-panel input {
            min-width: 180px;
            flex: 1 1 200px;
        }

        .search-container {
            position: relative;
            display: flex;
            align-items: center;
            flex: 1 1 200px;
            min-width: 180px;
        }

        .search-container input {
            width: 100%;
            padding-right: 32px;
        }

        .search-clear {
            position: absolute;
            right: 10px;
            cursor: pointer;
            color: var(--text-dim);
            font-size: 1.1rem;
            user-select: none;
            display: none;
            pointer-events: auto;
        }

        .search-container input:not(:placeholder-shown) + .search-clear {
            display: block;
        }

        .search-clear:hover {
            color: var(--accent-gold);
        }

        .control-panel button {
            cursor: pointer;
            transition: border-color 220ms ease, transform 220ms ease, background 220ms ease;
        }

        .control-panel button:hover {
            border-color: var(--accent-gold);
            transform: translateY(-1px);
        }

        .sync-status {
            margin-left: auto;
            font-size: 0.72rem;
            color: #9db4c3;
            letter-spacing: 0.02em;
            white-space: nowrap;
        }

        .sync-status.ok {
            color: #94d1bb;
        }

        .sync-status.warn {
            color: #d9bd86;
        }

        .sync-status.err {
            color: #d59a91;
        }

        .toggle {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            font-size: 0.76rem;
            color: var(--text-dim);
            padding: 0 4px;
        }

        .toggle input {
            accent-color: var(--accent-emerald);
            min-width: 0;
        }

        .chips {
            position: absolute;
            left: 18px;
            right: 18px;
            bottom: 18px;
            z-index: 5;
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            pointer-events: none;
            opacity: 0;
            transition: opacity 600ms ease;
        }

        .loaded .chips {
            opacity: 1;
        }

        .chip {
            pointer-events: auto;
            padding: 7px 10px;
            border-radius: 999px;
            border: 1px solid var(--chip-border);
            background: var(--chip-bg);
            font-size: 0.72rem;
            color: #d6e4ef;
            white-space: nowrap;
            text-shadow: 0 0 8px rgba(160, 198, 220, 0.25);
        }

        .chip strong {
            color: var(--accent-gold);
            font-weight: 700;
        }

        .details {
            position: absolute;
            top: 18px;
            right: 18px;
            width: min(380px, calc(100vw - 36px));
            max-height: calc(100vh - 160px);
            z-index: 5;
            overflow: auto;
            padding: 14px 16px;
            opacity: 0;
            transform: translateX(10px);
            transition: opacity 550ms ease, transform 700ms ease;
        }

        .loaded .details {
            opacity: 1;
            transform: translateX(0);
        }

        .details h2,
        .details h3 {
            margin: 0;
            font-family: 'Cinzel', serif;
            font-weight: 700;
            letter-spacing: 0.04em;
        }

        .details h2 {
            font-size: 1.1rem;
            color: var(--accent-gold);
        }

        .details h3 {
            font-size: 0.9rem;
            margin-top: 10px;
            color: #abcee1;
        }

        .details p {
            margin: 9px 0;
            line-height: 1.48;
            color: #d4d7d8;
            font-size: 0.82rem;
        }

        .details ul {
            margin: 7px 0 0;
            padding-left: 18px;
            color: #c3cfd7;
            font-size: 0.78rem;
            line-height: 1.42;
        }

        .details .meta-line {
            margin-top: 10px;
            font-size: 0.72rem;
            color: #8ba1af;
            word-break: break-word;
        }

        .pill-row {
            margin-top: 10px;
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
        }

        .pill {
            font-size: 0.68rem;
            padding: 4px 8px;
            border-radius: 999px;
            border: 1px solid rgba(135, 193, 217, 0.45);
            color: #d4e6ef;
            background: rgba(7, 18, 30, 0.9);
        }

        .tooltip {
            position: absolute;
            z-index: 10;
            pointer-events: none;
            opacity: 0;
            transition: opacity 180ms ease;
            max-width: 280px;
            padding: 8px 10px;
            border-radius: 10px;
            border: 1px solid rgba(197, 174, 117, 0.46);
            background: rgba(8, 14, 24, 0.95);
            color: #e3e4df;
            font-size: 0.74rem;
            line-height: 1.35;
        }

        .tooltip strong {
            color: var(--accent-gold);
            display: block;
            margin-bottom: 4px;
            font-size: 0.79rem;
            font-family: 'Cinzel', serif;
        }

        .node {
            cursor: pointer;
            transition: opacity 250ms ease, stroke 250ms ease, stroke-width 250ms ease;
        }

        .node.selected {
            stroke: var(--accent-gold) !important;
            stroke-width: 3px !important;
            animation: selected-pulse 2s infinite ease-in-out;
        }

        @keyframes selected-pulse {
            0% { filter: drop-shadow(0 0 2px var(--accent-gold)) url(#star-glow); }
            50% { filter: drop-shadow(0 0 8px var(--accent-gold)) url(#star-glow); }
            100% { filter: drop-shadow(0 0 2px var(--accent-gold)) url(#star-glow); }
        }

        .node.my-projects {
            stroke: var(--accent-gold);
            stroke-width: 1.5;
        }

        .node.interests {
            opacity: 0.65;
        }

        .label {
            fill: #d8e6ef;
            font-size: 10px;
            text-shadow: 0 0 8px rgba(4, 9, 15, 0.95);
            pointer-events: auto;
            cursor: pointer;
        }

        .label.landmark {
            font-family: 'Cinzel', serif;
            font-size: 12px;
            fill: #dfd1ab;
            letter-spacing: 0.03em;
        }

        .legend {
            position: absolute;
            bottom: 60px;
            right: 18px;
            z-index: 5;
            padding: 10px 14px;
            display: flex;
            flex-direction: column;
            gap: 6px;
            max-height: 260px;
            overflow-y: auto;
            opacity: 0;
            transition: opacity 600ms ease;
        }

        .loaded .legend {
            opacity: 1;
        }

        .legend-item {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 0.72rem;
            color: var(--text-dim);
            cursor: pointer;
            padding: 2px 0;
            transition: color 200ms ease;
        }

        .legend-item:hover {
            color: var(--text-main);
        }

        .legend-dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            flex-shrink: 0;
        }

        .empty {
            position: absolute;
            inset: 0;
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 12;
            text-align: center;
            font-size: 1rem;
            color: #d4d1c3;
            background: rgba(5, 11, 20, 0.72);
            padding: 20px;
        }

        .empty.visible {
            display: flex;
        }

        .toast-stack {
            position: absolute;
            right: 18px;
            bottom: 118px;
            z-index: 14;
            display: flex;
            flex-direction: column;
            gap: 8px;
            pointer-events: none;
            width: min(360px, calc(100vw - 36px));
        }

        .toast {
            pointer-events: none;
            border-radius: 10px;
            border: 1px solid rgba(135, 193, 217, 0.4);
            background: rgba(8, 14, 24, 0.9);
            color: #dce9f0;
            padding: 8px 10px;
            font-size: 0.74rem;
            line-height: 1.35;
            box-shadow: 0 12px 24px rgba(0, 0, 0, 0.28);
            opacity: 0;
            transform: translateY(6px);
            animation: toast-in 260ms ease forwards;
        }

        .toast.ok {
            border-color: rgba(114, 184, 165, 0.75);
        }

        .toast.warn {
            border-color: rgba(197, 174, 117, 0.75);
        }

        .toast.err {
            border-color: rgba(186, 115, 104, 0.75);
        }

        @keyframes toast-in {
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @media (max-width: 980px) {
            .hud {
                grid-template-columns: 1fr;
                right: 12px;
                left: 12px;
                top: 12px;
            }

            .details {
                top: auto;
                bottom: 74px;
                right: 12px;
                left: 12px;
                width: auto;
                max-height: 38vh;
            }

            .chips {
                left: 12px;
                right: 12px;
                bottom: 10px;
            }

            .toast-stack {
                right: 12px;
                left: 12px;
                width: auto;
                bottom: 118px;
            }

            .title {
                font-size: 1.02rem;
            }

            .legend {
                bottom: 50px;
                right: 12px;
                max-height: 180px;
            }
        }
    </style>
</head>
<body>
    <div id="overlay">
        <button class="start-btn" id="startBtn">Initialize Atlas</button>
        <div class="start-hint">Commence synchronization and audio alignment</div>
    </div>

    <div id="app">
        <canvas id="nebula"></canvas>
        <canvas id="starfield"></canvas>
        <div id="graph"></div>
        <div id="audioControl">Mute Audio</div>

        <div class="hud">
            <section class="panel title-panel">
                <h1 class="title">Constellation Atlas of Interests</h1>
                <p class="subtitle" id="summaryText">Sampling project intent from recursive summaries...</p>
                <div class="meta" id="metaText">Awaiting telemetry.</div>
            </section>

            <section class="panel control-panel">
                <div class="view-toggle-group">
                    <button class="view-btn active" id="viewCore" title="Show only original works and contributions">Ember's Galaxy</button>
                    <button class="view-btn" id="viewAll" title="Show all projects including interests">Known Universe</button>
                </div>
                <div class="search-container">
                    <input id="searchInput" type="search" placeholder="Search project or concept" autocomplete="off" />
                    <span class="search-clear" id="searchClear">&times;</span>
                </div>
                <select id="categorySelect">
                    <option value="all">All categories</option>
                </select>
                <div style="display: flex; gap: 15px; align-items: center; pointer-events: auto;">
                    <label class="toggle">
                        <input id="liveToggle" type="checkbox" checked /> Live Sync
                    </label>
                </div>
                <div style="display: flex; gap: 8px; pointer-events: auto;">
                    <button id="refreshBtn" type="button" style="flex: 1;">Sync Now</button>
                    <button id="recenterBtn" type="button" style="flex: 1;">Recenter</button>
                </div>
                <span class="sync-status" id="syncStatus">Sync idle</span>
            </section>
        </div>

        <aside class="panel details" id="detailsPanel"></aside>

        <div class="legend panel" id="categoryLegend"></div>
        <div class="chips" id="chips"></div>
        <div class="tooltip" id="tooltip"></div>
        <div class="empty" id="emptyState"></div>
        <div class="toast-stack" id="toastStack"></div>
    </div>

    <script>
        class NebulaBackground {
            constructor(canvasId) {
                this.canvas = document.getElementById(canvasId);
                this.gl = this.canvas.getContext('webgl');
                if (!this.gl) return;

                this.program = this.createProgram();
                this.initBuffers();
                this.resize();
                window.addEventListener('resize', () => this.resize());
            }

            createProgram() {
                const vs = `
                    attribute vec2 position;
                    void main() { gl_Position = vec4(position, 0.0, 1.0); }
                `;
                const fs = `
                    precision highp float;
                    uniform float time;
                    uniform vec2 resolution;

                    float noise(vec2 p) {
                        return fract(sin(dot(p, vec2(12.9898, 78.233))) * 43758.5453);
                    }

                    float smooth_noise(vec2 p) {
                        vec2 i = floor(p);
                        vec2 f = fract(p);
                        f = f * f * (3.0 - 2.0 * f);
                        float a = noise(i);
                        float b = noise(i + vec2(1.0, 0.0));
                        float c = noise(i + vec2(0.0, 1.0));
                        float d = noise(i + vec2(1.0, 1.0));
                        return mix(mix(a, b, f.x), mix(c, d, f.x), f.y);
                    }

                    float fbm(vec2 p) {
                        float v = 0.0;
                        float a = 0.5;
                        for (int i = 0; i < 5; i++) {
                            v += a * smooth_noise(p);
                            p *= 2.0;
                            a *= 0.5;
                        }
                        return v;
                    }

                    void main() {
                        vec2 uv = gl_FragCoord.xy / resolution.xy;
                        vec2 p = uv - 0.5;
                        p.x *= resolution.x / resolution.y;
                        
                        float r = length(p);
                        
                        // Periodic Swirl: instead of winding infinitely, it "breathes" in and out
                        float swirlIntensity = 0.6 * sin(time * 0.2);
                        float a = atan(p.y, p.x) + swirlIntensity / (r + 0.8);
                        vec2 uvWarped = vec2(cos(a), sin(a)) * r;
                        
                        // Drifting base coordinates
                        vec2 uvDrift = p + vec2(sin(time * 0.05) * 0.1, time * 0.02);
                        
                        // Blend the two for complex but stable motion
                        vec2 uvFinal = mix(uvDrift, uvWarped, 0.4);

                        float n = fbm(uvFinal * 2.0 + time * 0.03);
                        float n2 = fbm(uvFinal * 3.0 - time * 0.02);
                        float n3 = fbm(uvFinal * 4.0 + n * 0.4);
                        
                        vec3 color1 = vec3(0.01, 0.03, 0.07); // Void
                        vec3 color2 = vec3(0.15, 0.05, 0.25); // Magenta/Purple
                        vec3 color3 = vec3(0.05, 0.2, 0.3);  // Cyan/Teal
                        
                        vec3 finalColor = mix(color1, color2, n * 1.3);
                        finalColor = mix(finalColor, color3, n2 * n3 * 1.6);
                        
                        finalColor += pow(n3, 10.0) * 0.4; // Star clouds
                        finalColor *= 1.3 - r; // Vignette
                        
                        gl_FragColor = vec4(finalColor, 1.0);
                    }
                `;

                const vShader = this.compileShader(this.gl.VERTEX_SHADER, vs);
                const fShader = this.compileShader(this.gl.FRAGMENT_SHADER, fs);
                const prog = this.gl.createProgram();
                this.gl.attachShader(prog, vShader);
                this.gl.attachShader(prog, fShader);
                this.gl.linkProgram(prog);
                return prog;
            }

            compileShader(type, src) {
                const s = this.gl.createShader(type);
                this.gl.shaderSource(s, src);
                this.gl.compileShader(s);
                return s;
            }

            initBuffers() {
                const buf = this.gl.createBuffer();
                this.gl.bindBuffer(this.gl.ARRAY_BUFFER, buf);
                this.gl.bufferData(this.gl.ARRAY_BUFFER, new Float32Array([-1, -1, 1, -1, -1, 1, 1, 1]), this.gl.STATIC_DRAW);
                const pos = this.gl.getAttribLocation(this.program, 'position');
                this.gl.enableVertexAttribArray(pos);
                this.gl.vertexAttribPointer(pos, 2, this.gl.FLOAT, false, 0, 0);
            }

            resize() {
                const ratio = window.devicePixelRatio || 1;
                this.canvas.width = window.innerWidth * ratio;
                this.canvas.height = window.innerHeight * ratio;
                this.gl.viewport(0, 0, this.canvas.width, this.canvas.height);
            }

            render(t) {
                if (!this.gl) return;
                this.gl.useProgram(this.program);
                this.gl.uniform1f(this.gl.getUniformLocation(this.program, 'time'), t * 0.001);
                this.gl.uniform2f(this.gl.getUniformLocation(this.program, 'resolution'), this.canvas.width, this.canvas.height);
                this.gl.drawArrays(this.gl.TRIANGLE_STRIP, 0, 4);
            }
        }

        class GenerativeComposer {
            constructor() {
                this.ctx = null;
                this.masterGain = null;
                this.compressor = null;
                this.playing = false;
                this.timer = null;
                this.scale = [174.61, 207.65, 233.08, 261.63, 311.13, 349.23]; // F Minor Pentatonic
            }

            init() {
                this.ctx = new (window.AudioContext || window.webkitAudioContext)();
                this.compressor = this.ctx.createDynamicsCompressor();
                this.compressor.threshold.value = -24;
                this.compressor.knee.value = 30;
                this.compressor.ratio.value = 12;
                this.compressor.attack.value = 0.003;
                this.compressor.release.value = 0.25;

                this.masterGain = this.ctx.createGain();
                this.masterGain.gain.value = 0.2;

                this.masterGain.connect(this.compressor);
                this.compressor.connect(this.ctx.destination);

                this.startBass();
                this.startPads();
                this.startMelodyLoop();
                this.startPercussionLoop();
                this.playing = true;
            }

            createNoiseBuffer() {
                const bufferSize = this.ctx.sampleRate * 2;
                const buffer = this.ctx.createBuffer(1, bufferSize, this.ctx.sampleRate);
                const data = buffer.getChannelData(0);
                for (let i = 0; i < bufferSize; i++) {
                    data[i] = Math.random() * 2 - 1;
                }
                return buffer;
            }

            startPercussionLoop() {
                const noiseBuffer = this.createNoiseBuffer();
                const playHit = () => {
                    if (this.playing) {
                        const source = this.ctx.createBufferSource();
                        source.buffer = noiseBuffer;
                        
                        const filter = this.ctx.createBiquadFilter();
                        filter.type = 'highpass';
                        filter.frequency.value = 5000;
                        
                        const gain = this.ctx.createGain();
                        gain.gain.setValueAtTime(0.02, this.ctx.currentTime);
                        gain.gain.exponentialRampToValueAtTime(0.001, this.ctx.currentTime + 0.1);
                        
                        source.connect(filter);
                        filter.connect(gain);
                        gain.connect(this.masterGain);
                        
                        source.start();
                        source.stop(this.ctx.currentTime + 0.1);
                    }
                    setTimeout(() => playHit(), 500); // 120 BPM quarter notes
                };
                playHit();
            }

            startBass() {
                const playPulse = () => {
                    if (this.playing) {
                        const osc = this.ctx.createOscillator();
                        const gain = this.ctx.createGain();
                        osc.type = 'triangle';
                        osc.frequency.setValueAtTime(43.65, this.ctx.currentTime); // Low F
                        osc.frequency.exponentialRampToValueAtTime(30, this.ctx.currentTime + 0.5);
                        
                        gain.gain.setValueAtTime(0, this.ctx.currentTime);
                        gain.gain.linearRampToValueAtTime(0.3, this.ctx.currentTime + 0.1);
                        gain.gain.exponentialRampToValueAtTime(0.001, this.ctx.currentTime + 0.8);
                        
                        osc.connect(gain);
                        gain.connect(this.masterGain);
                        osc.start();
                        osc.stop(this.ctx.currentTime + 1);
                    }
                    setTimeout(() => playPulse(), 2000); // Steady 2s pulse
                };
                playPulse();
            }

            startPads() {
                const freqs = [87.31, 130.81, 174.61, 207.65, 261.63];
                freqs.forEach(f => {
                    const osc = this.ctx.createOscillator();
                    const gain = this.ctx.createGain();
                    const lfo = this.ctx.createOscillator();
                    const lfoGain = this.ctx.createGain();

                    osc.type = 'sawtooth';
                    osc.frequency.value = f + (Math.random() - 0.5);
                    
                    // Filter for that "dope" synth feel
                    const filter = this.ctx.createBiquadFilter();
                    filter.type = 'lowpass';
                    filter.frequency.value = 400;
                    filter.Q.value = 5;

                    lfo.frequency.value = 0.1 + Math.random() * 0.1;
                    lfoGain.gain.value = 200;
                    lfo.connect(lfoGain);
                    lfoGain.connect(filter.frequency);
                    lfo.start();

                    gain.gain.value = 0;
                    osc.connect(filter);
                    filter.connect(gain);
                    gain.connect(this.masterGain);
                    
                    osc.start();
                    gain.gain.linearRampToValueAtTime(0.05, this.ctx.currentTime + 5);
                });
            }

            startMelodyLoop() {
                const delay = this.ctx.createDelay();
                delay.delayTime.value = 0.4;
                const feedback = this.ctx.createGain();
                feedback.gain.value = 0.4;
                
                delay.connect(feedback);
                feedback.connect(delay);
                delay.connect(this.masterGain);

                const playNote = () => {
                    if (this.playing && Math.random() > 0.4) {
                        const freq = this.scale[Math.floor(Math.random() * this.scale.length)] * (Math.random() > 0.8 ? 2 : 1);
                        const osc = this.ctx.createOscillator();
                        const gain = this.ctx.createGain();
                        
                        osc.type = 'sine';
                        osc.frequency.setValueAtTime(freq, this.ctx.currentTime);
                        
                        gain.gain.setValueAtTime(0, this.ctx.currentTime);
                        gain.gain.linearRampToValueAtTime(0.1, this.ctx.currentTime + 0.05);
                        gain.gain.exponentialRampToValueAtTime(0.001, this.ctx.currentTime + 0.5);
                        
                        osc.connect(gain);
                        gain.connect(delay);
                        gain.connect(this.masterGain);
                        
                        osc.start();
                        osc.stop(this.ctx.currentTime + 1);
                    }
                    setTimeout(() => playNote(), 500 + Math.random() * 1500);
                };
                playNote();
            }

            toggle() {
                if (!this.ctx) {
                    this.init();
                    return true;
                }
                this.playing = !this.playing;
                if (this.playing) {
                    this.masterGain.gain.setTargetAtTime(0.2, this.ctx.currentTime, 1.0);
                } else {
                    this.masterGain.gain.setTargetAtTime(0, this.ctx.currentTime, 0.5);
                }
                return this.playing;
            }
        }

        const state = {
            allProjects: [],
            interests: null,
            metaconstellations: [],
            metaconstellationsGeneratedAt: null,
            filteredProjects: [],
            nodesById: new Map(),
            neighbors: new Map(),
            graphData: null,
            topCategories: [],
            zoom: null,
            svg: null,
            g: null,
            width: window.innerWidth,
            height: window.innerHeight,
            selectedId: null,
            hoveredId: null,
            viewMode: "core", // core | all
            searchTerm: "",
            category: "all",
            liveSync: true,
            syncIntervalMs: 12000,
            syncTimer: null,
            syncInFlight: false,
            lastSnapshotKey: "",
            lastGeneratedAt: null,
            initialLoadDone: false,
        };

        const emptyState = document.getElementById("emptyState");
        const summaryText = document.getElementById("summaryText");
        const metaText = document.getElementById("metaText");
        const chipsEl = document.getElementById("chips");
        const detailsPanel = document.getElementById("detailsPanel");
        const tooltip = document.getElementById("tooltip");
        const searchInput = document.getElementById("searchInput");
        const categorySelect = document.getElementById("categorySelect");
        const liveToggle = document.getElementById("liveToggle");
        const refreshBtn = document.getElementById("refreshBtn");
        const recenterBtn = document.getElementById("recenterBtn");
        const syncStatus = document.getElementById("syncStatus");
        const toastStack = document.getElementById("toastStack");
        
        const nebula = new NebulaBackground('nebula');
        const composer = new GenerativeComposer();

        function deriveInterests(projects) {
            const count = (arr) => {
                const map = new Map();
                arr.forEach((item) => {
                    const original = String(item || "").trim();
                    if (!original) return;
                    const key = original.toLowerCase();
                    const existing = map.get(key) || { name: original, count: 0 };
                    existing.count += 1;
                    // Prefer the version with more capitals or just the first one found
                    if (original !== key && original.length > 0) {
                        existing.name = original;
                    }
                    map.set(key, existing);
                });
                return [...map.values()].sort((a, b) => b.count - a.count);
            };

            const embeddingReady = projects.filter((p) => p.embedding_ready).length;
            const totalProjects = projects.length;

            return {
                top_categories: count(projects.map((p) => p.category)).slice(0, 12).map((x) => ({ name: x.name, count: x.count })),
                top_concepts: count(projects.flatMap((p) => p.concepts || [])).slice(0, 20).map((x) => ({ name: x.name, count: x.count })),
                top_tags: count(projects.flatMap((p) => p.tags || [])).slice(0, 20).map((x) => ({ name: x.name, count: x.count })),
                top_mined_motifs: count(projects.flatMap((p) => p.mined_motifs || [])).slice(0, 20).map((x) => ({ name: x.name, count: x.count })),
                top_metaconstellations: count(
                    projects.flatMap((p) => (p.metaconstellations || []).map((m) => m.name || m))
                ).slice(0, 10).map((x) => ({ name: x.name, count: x.count })),
                top_languages: count(projects.flatMap((p) => p.languages || [])).slice(0, 10).map((x) => ({ name: x.name, count: x.count })),
                embedding_coverage: {
                    ready: embeddingReady,
                    total: totalProjects,
                    pct: totalProjects ? Number(((embeddingReady / totalProjects) * 100).toFixed(2)) : 0,
                },
            };
        }

        function normalizeProject(raw) {
            const embedding = (raw.embedding && typeof raw.embedding === "object") ? raw.embedding : null;
            const metaconstellations = Array.isArray(raw.metaconstellations)
                ? raw.metaconstellations
                    .map((item) => {
                        if (typeof item === "string") {
                            const name = item.trim();
                            return name ? { id: "", name, score: null, matches: [] } : null;
                        }
                        if (!item || typeof item !== "object") return null;
                        const name = String(item.name || "").trim();
                        if (!name) return null;
                        return {
                            id: String(item.id || "").trim(),
                            name,
                            score: Number.isFinite(item.score) ? Number(item.score) : null,
                            matches: Array.isArray(item.matches) ? item.matches.map((x) => String(x || "").trim()).filter(Boolean) : [],
                        };
                    })
                    .filter(Boolean)
                : [];
            return {
                ...raw,
                name: raw.name || "Unnamed",
                description: raw.description || "No summary available yet.",
                category: raw.category || "Exploratory",
                concepts: Array.isArray(raw.concepts) ? raw.concepts : [],
                tags: Array.isArray(raw.tags) ? raw.tags : [],
                mined_motifs: Array.isArray(raw.mined_motifs) ? raw.mined_motifs : [],
                motif_neighbors: Array.isArray(raw.motif_neighbors) ? raw.motif_neighbors : [],
                metaconstellations,
                embedding,
                embedding_ready: Boolean(raw.embedding_ready || embedding),
                attribution: raw.attribution || "interests",
                languages: Array.isArray(raw.languages) ? raw.languages : [],
                display_path: raw.display_path || raw._path || "",
            };
        }

        function normalizePayload(payload) {
            if (Array.isArray(payload)) {
                const projects = payload.map(normalizeProject);
                return {
                    projects,
                    interests: deriveInterests(projects),
                    metaconstellations: [],
                    metaconstellationsGeneratedAt: null,
                    generatedAt: null,
                };
            }

            const projects = Array.isArray(payload.projects)
                ? payload.projects.map(normalizeProject)
                : [];
            const metaconstellations = Array.isArray(payload.metaconstellations)
                ? payload.metaconstellations
                : [];
            const derived = deriveInterests(projects);
            const interests = payload.interests
                ? { ...derived, ...payload.interests }
                : derived;
            return {
                projects,
                interests,
                metaconstellations,
                metaconstellationsGeneratedAt: payload.metaconstellations_generated_at || null,
                generatedAt: payload.generated_at || null,
            };
        }

        function projectKey(project) {
            return project._path || `${project.name}::${project.display_path}`;
        }

        function projectSignature(project) {
            return `${projectKey(project)}|${project._hash || ""}|${project._updated_at || ""}`;
        }

        function computeSnapshotKey(projects, metaconstellations) {
            const projectPart = projects.map(projectSignature).sort().join("\n");
            const metaPart = (Array.isArray(metaconstellations) ? metaconstellations : [])
                .map((meta) => `${String(meta.id || "")}|${String(meta.name || "")}|${String(meta.project_count || 0)}`)
                .sort()
                .join("\n");
            return `${projectPart}\n---\n${metaPart}`;
        }

        function computeProjectDiff(previousProjects, nextProjects) {
            const prevMap = new Map(previousProjects.map((project) => [projectKey(project), project]));
            const nextMap = new Map(nextProjects.map((project) => [projectKey(project), project]));

            let added = 0;
            let updated = 0;
            let removed = 0;

            nextMap.forEach((nextProject, key) => {
                if (!prevMap.has(key)) {
                    added += 1;
                    return;
                }

                const prevProject = prevMap.get(key);
                if ((prevProject?._hash || "") !== (nextProject?._hash || "")
                    || (prevProject?._updated_at || "") !== (nextProject?._updated_at || "")) {
                    updated += 1;
                }
            });

            prevMap.forEach((_, key) => {
                if (!nextMap.has(key)) {
                    removed += 1;
                }
            });

            return { added, updated, removed, total: added + updated + removed };
        }

        function setSyncStatus(text, tone = "ok") {
            syncStatus.textContent = text;
            syncStatus.classList.remove("ok", "warn", "err");
            syncStatus.classList.add(tone);
        }

        function showToast(message, tone = "ok") {
            const toast = document.createElement("div");
            toast.className = `toast ${tone}`;
            toast.textContent = message;
            toastStack.prepend(toast);

            while (toastStack.childElementCount > 4) {
                toastStack.lastElementChild?.remove();
            }

            window.setTimeout(() => {
                toast.style.opacity = "0";
                toast.style.transform = "translateY(6px)";
                window.setTimeout(() => toast.remove(), 200);
            }, 3600);
        }

        async function fetchPayload() {
            const response = await fetch("/api/data", { cache: "no-store" });
            if (!response.ok) {
                throw new Error(`HTTP ${response.status}`);
            }
            return normalizePayload(await response.json());
        }

        function applyPayload(payload, { announce = false } = {}) {
            const previousProjects = state.allProjects;
            const diff = computeProjectDiff(previousProjects, payload.projects);

            state.allProjects = payload.projects;
            state.interests = payload.interests;
            state.metaconstellations = payload.metaconstellations || [];
            state.metaconstellationsGeneratedAt = payload.metaconstellationsGeneratedAt || null;
            state.lastGeneratedAt = payload.generatedAt;
            state.lastSnapshotKey = computeSnapshotKey(payload.projects, payload.metaconstellations || []);

            renderHeader(payload.generatedAt);
            renderChips();
            buildCategoryOptions(state.allProjects);

            if (!state.allProjects.length) {
                setEmpty("No summaries found in ~/.summarization. Run `cargo run --manifest-path ~/dev/starmap/resummarize/Cargo.toml --` first.", true);
                detailsPanel.innerHTML = `<h2>Atlas Offline</h2><p>Once summaries exist, this map will cluster projects into constellations and motifs.</p>`;
                d3.select("#graph").selectAll("*").remove();
                state.svg = null;
                state.g = null;
            } else {
                setEmpty("", false);
                if (!state.svg) {
                    setupScene();
                }
                renderGraph();
            }

            if (announce && diff.total > 0) {
                const parts = [];
                if (diff.added) parts.push(`+${diff.added} new`);
                if (diff.updated) parts.push(`${diff.updated} revised`);
                if (diff.removed) parts.push(`${diff.removed} retired`);
                showToast(`Atlas refresh: ${parts.join(", ")}`, "ok");
            }
        }

        async function syncData({ manual = false, announce = false } = {}) {
            if (state.syncInFlight) {
                return;
            }

            state.syncInFlight = true;
            setSyncStatus(manual ? "Syncing now..." : "Live syncing...", "warn");

            try {
                const payload = await fetchPayload();
                const nextSnapshot = computeSnapshotKey(payload.projects, payload.metaconstellations || []);
                const changed = nextSnapshot !== state.lastSnapshotKey;

                if (!state.initialLoadDone || changed || manual) {
                    applyPayload(payload, { announce });
                }

                if (manual && state.initialLoadDone && !changed) {
                    showToast("No new stars yet.", "warn");
                }

                state.initialLoadDone = true;
                setSyncStatus(state.liveSync ? "Live sync online" : "Live sync paused", "ok");
            } catch (error) {
                console.error(error);
                if (!state.initialLoadDone) {
                    setEmpty("Unable to reach /api/data. Start the server with `uv run python dev/starmap/serve.py`.", true);
                    detailsPanel.innerHTML = `<h2>Sensor Fault</h2><p>${escapeHtml(String(error))}</p>`;
                    summaryText.textContent = "Telemetry link failed.";
                    metaText.textContent = "Check starmap server process.";
                } else {
                    showToast("Sync failed. Retrying on next pulse.", "err");
                }
                setSyncStatus("Sync fault", "err");
            } finally {
                state.syncInFlight = false;
            }
        }

        function buildCategoryOptions(projects) {
            const categories = [...new Set(projects.map((p) => p.category).filter(Boolean))].sort();
            categorySelect.innerHTML = `<option value="all">All categories</option>${categories
                .map((c) => `<option value="${escapeHtml(c)}">${escapeHtml(c)}</option>`)
                .join("")}`;
            if (!categories.includes(state.category)) state.category = "all";
            categorySelect.value = state.category;
        }

        function escapeHtml(value) {
            return String(value)
                .replaceAll("&", "&amp;")
                .replaceAll("<", "&lt;")
                .replaceAll(">", "&gt;")
                .replaceAll('"', "&quot;")
                .replaceAll("'", "&#039;");
        }

        function currentProjects() {
            const search = state.searchTerm.trim().toLowerCase();
            return state.allProjects.filter((project) => {
                if (state.viewMode === "core" && project.attribution === "interests") {
                    return false;
                }

                if (state.category !== "all" && project.category !== state.category) {
                    return false;
                }

                if (!search) {
                    return true;
                }

                const haystack = [
                    project.name,
                    project.description,
                    project.category,
                    ...(project.concepts || []),
                    ...(project.tags || []),
                    ...(project.mined_motifs || []),
                    ...((project.metaconstellations || []).map((m) => m.name || "")),
                ]
                    .join(" ")
                    .toLowerCase();
                return haystack.includes(search);
            });
        }

        function projectMetaconstellationNames(project) {
            return (project.metaconstellations || [])
                .map((item) => String(item?.name || "").trim())
                .filter(Boolean);
        }

        // Category color palette for scatter plot
        const CATEGORY_PALETTE = [
            "#c5ae75", "#87c1d9", "#72b8a5", "#d4917a",
            "#9b8ec4", "#8bc478", "#d4c478", "#c47878",
        ];
        const CATEGORY_OTHER_COLOR = "#7a9ab5";

        function buildCategoryColorScale(projects) {
            const catCounts = new Map();
            projects.forEach(p => {
                const cat = p.category || "Other";
                catCounts.set(cat, (catCounts.get(cat) || 0) + 1);
            });
            const topCats = [...catCounts.entries()]
                .sort((a, b) => b[1] - a[1])
                .slice(0, CATEGORY_PALETTE.length)
                .map(([cat]) => cat);
            state.topCategories = topCats;
            return (category) => {
                const idx = topCats.indexOf(category);
                return idx >= 0 ? CATEGORY_PALETTE[idx] : CATEGORY_OTHER_COLOR;
            };
        }

        function buildGraphData(projects) {
            const nodes = [];
            projects.forEach((project) => {
                const projectId = `project:${project.name}:${project.display_path}`;
                nodes.push({
                    id: projectId,
                    label: project.name,
                    type: "project",
                    project,
                    category: project.category,
                    attribution: project.attribution,
                    r: 5 + Math.min(7, (project.concepts.length + project.tags.length + project.mined_motifs.length) * 0.3),
                });
            });
            return { nodes };
        }

        function buildNeighborIndex(nodes) {
            const neighbors = new Map();
            nodes.forEach(n => neighbors.set(n.id, new Set([n.id])));

            // Index concepts to find projects that share them
            const conceptIndex = new Map();
            nodes.forEach(n => {
                if (n.type !== "project") return;
                const allConcepts = [
                    ...(n.project.concepts || []),
                    ...(n.project.tags || []),
                    ...(n.project.mined_motifs || []),
                ];
                allConcepts.forEach(c => {
                    const key = c.toLowerCase();
                    if (!conceptIndex.has(key)) conceptIndex.set(key, []);
                    conceptIndex.get(key).push(n.id);
                });
            });

            // Also use motif_neighbors from embeddings
            nodes.forEach(n => {
                if (n.type !== "project") return;
                const mn = n.project.motif_neighbors || [];
                mn.forEach(neighbor => {
                    const otherId = nodes.find(o =>
                        o.type === "project" &&
                        o.project.name === neighbor.name
                    )?.id;
                    if (otherId && otherId !== n.id) {
                        neighbors.get(n.id).add(otherId);
                        neighbors.get(otherId).add(n.id);
                    }
                });
            });

            // Connect projects sharing concepts (limit to concepts with <= 20 projects to avoid mega-hubs)
            conceptIndex.forEach((ids) => {
                if (ids.length < 2 || ids.length > 20) return;
                ids.forEach(a => {
                    ids.forEach(b => {
                        if (a !== b) {
                            neighbors.get(a).add(b);
                            neighbors.get(b).add(a);
                        }
                    });
                });
            });

            return neighbors;
        }

        function setupScene() {
            const graph = d3.select("#graph");
            graph.selectAll("*").remove();

            state.width = window.innerWidth;
            state.height = window.innerHeight;

            state.svg = graph.append("svg")
                .attr("viewBox", `0 0 ${state.width} ${state.height}`)
                .attr("preserveAspectRatio", "xMidYMid slice");

            const defs = state.svg.append("defs");

            const glow = defs.append("filter")
                .attr("id", "star-glow")
                .attr("x", "-50%")
                .attr("y", "-50%")
                .attr("width", "200%")
                .attr("height", "200%");
            glow.append("feGaussianBlur").attr("stdDeviation", "2.8").attr("result", "blur");
            glow.append("feMerge").selectAll("feMergeNode")
                .data(["blur", "SourceGraphic"])
                .join("feMergeNode")
                .attr("in", (d) => d);

            state.g = state.svg.append("g");
            state.g.append("g").attr("class", "node-layer");
            state.g.append("g").attr("class", "label-layer");

            state.zoom = d3.zoom()
                .scaleExtent([0.35, 6])
                .on("zoom", (event) => {
                    state.g.attr("transform", event.transform);
                    updateLabelVisibility(event.transform.k);
                });

            state.svg.call(state.zoom);
            recenter();
        }

        function updateLabelVisibility(k) {
            if (!state.g) return;
            state.g.select(".label-layer").selectAll("text")
                .attr("visibility", d => {
                    if (d.landmark) return "visible";
                    if (k >= 2.0) return "visible";
                    if (k >= 1.2 && d.r >= 7) return "visible";
                    return "hidden";
                });
        }

        function recenter() {
            if (!state.svg || !state.zoom) return;
            const transform = d3.zoomIdentity.translate(state.width * 0.5, state.height * 0.5).scale(0.86).translate(-state.width * 0.5, -state.height * 0.5);
            state.svg.transition().duration(650).call(state.zoom.transform, transform);
        }

        function renderGraph() {
            if (!state.allProjects.length) return;
            if (!state.svg) setupScene();

            state.filteredProjects = currentProjects();
            const graphData = buildGraphData(state.filteredProjects);
            state.graphData = graphData;

            state.nodesById = new Map(graphData.nodes.map((n) => [n.id, n]));
            state.neighbors = buildNeighborIndex(graphData.nodes);

            // Position from UMAP coordinates
            const padding = 80;
            const xScale = d3.scaleLinear().domain([0, 1]).range([padding, state.width - padding]);
            const yScale = d3.scaleLinear().domain([0, 1]).range([padding, state.height - padding]);

            graphData.nodes.forEach(node => {
                const p = node.project;
                if (p && p.umap_x != null && p.umap_y != null) {
                    node.x = xScale(p.umap_x);
                    node.y = yScale(p.umap_y);
                } else {
                    node.x = state.width / 2 + (Math.random() - 0.5) * 200;
                    node.y = state.height / 2 + (Math.random() - 0.5) * 200;
                }
            });

            // Mark landmarks (top N by richness)
            const sorted = [...graphData.nodes].sort((a, b) => b.r - a.r);
            sorted.slice(0, 12).forEach(n => { n.landmark = true; });

            const categoryColor = buildCategoryColorScale(state.filteredProjects);
            const nodeLayer = state.g.select(".node-layer");
            const labelLayer = state.g.select(".label-layer");

            nodeLayer.selectAll("circle")
                .data(graphData.nodes, d => d.id)
                .join(
                    enter => enter.append("circle")
                        .attr("cx", d => d.x)
                        .attr("cy", d => d.y)
                        .attr("r", 0)
                        .attr("opacity", 0)
                        .call(e => e.transition().duration(500)
                            .attr("r", d => d.r)
                            .attr("opacity", 1)),
                    update => update
                        .call(u => u.transition().duration(500)
                            .attr("cx", d => d.x)
                            .attr("cy", d => d.y)
                            .attr("r", d => d.r)),
                    exit => exit
                        .call(e => e.transition().duration(300)
                            .attr("r", 0).attr("opacity", 0).remove())
                )
                .attr("class", d => `node project ${d.attribution || ""}`.trim())
                .attr("fill", d => categoryColor(d.category))
                .attr("stroke", d => d.attribution === "my-projects" ? "var(--accent-gold)" : "rgba(250, 231, 186, 0.35)")
                .attr("stroke-width", d => d.attribution === "my-projects" ? 1.5 : 0.8)
                .attr("filter", "url(#star-glow)");

            labelLayer.selectAll("text")
                .data(graphData.nodes, d => d.id)
                .join(
                    enter => enter.append("text")
                        .attr("x", d => d.x + d.r + 4)
                        .attr("y", d => d.y + 3)
                        .attr("opacity", 0)
                        .call(e => e.transition().duration(500).attr("opacity", 0.9)),
                    update => update
                        .call(u => u.transition().duration(500)
                            .attr("x", d => d.x + d.r + 4)
                            .attr("y", d => d.y + 3)),
                    exit => exit.call(e => e.transition().duration(300).attr("opacity", 0).remove())
                )
                .attr("class", d => d.landmark ? "label landmark" : "label")
                .text(d => d.label);

            // Apply current zoom level to label visibility
            const currentTransform = d3.zoomTransform(state.svg.node());
            updateLabelVisibility(currentTransform.k);

            // Event handlers
            state.svg.on("click", (event) => {
                if (event.target.tagName === "svg") {
                    state.selectedId = null;
                    applyHighlight(null);
                    renderOverview();
                }
            });

            const onHover = (event, d) => {
                state.hoveredId = d.id;
                applyHighlight(d.id);
                showTooltip(event, d);
            };
            const onMove = (event) => {
                tooltip.style.left = `${event.pageX + 14}px`;
                tooltip.style.top = `${event.pageY - 14}px`;
            };
            const onOut = () => {
                state.hoveredId = null;
                hideTooltip();
                applyHighlight(state.selectedId);
            };
            const onClick = (event, d) => {
                event.stopPropagation();
                if (state.selectedId === d.id) {
                    state.selectedId = null;
                    applyHighlight(null);
                    renderOverview();
                } else {
                    state.selectedId = d.id;
                    applyHighlight(d.id);
                    renderDetails(d);
                }
            };

            nodeLayer.selectAll("circle")
                .on("mouseover", onHover)
                .on("mousemove", onMove)
                .on("mouseout", onOut)
                .on("click", onClick);

            labelLayer.selectAll("text")
                .on("mouseover", onHover)
                .on("mousemove", onMove)
                .on("mouseout", onOut)
                .on("click", onClick);

            if (state.selectedId && !state.nodesById.has(state.selectedId)) {
                state.selectedId = null;
            }

            applyHighlight(state.selectedId);
            renderLegend(categoryColor);
            renderOverview();
        }

        function renderLegend(colorScale) {
            const legendEl = document.getElementById("categoryLegend");
            if (!legendEl || !state.topCategories) return;
            const items = state.topCategories.map((cat, i) =>
                `<div class="legend-item" data-category="${escapeHtml(cat)}"><span class="legend-dot" style="background:${CATEGORY_PALETTE[i]}"></span>${escapeHtml(cat)}</div>`
            );
            items.push(`<div class="legend-item" data-category=""><span class="legend-dot" style="background:${CATEGORY_OTHER_COLOR}"></span>Other</div>`);
            legendEl.innerHTML = items.join("");
            legendEl.querySelectorAll(".legend-item").forEach(el => {
                el.addEventListener("click", () => {
                    const cat = el.getAttribute("data-category");
                    categorySelect.value = cat || "all";
                    state.category = cat || "all";
                    renderGraph();
                });
            });
        }

        function applyHighlight(centerId) {
            const nodes = state.g.select(".node-layer").selectAll("circle");
            const labels = state.g.select(".label-layer").selectAll("text");

            if (!centerId || !state.neighbors.has(centerId)) {
                nodes.attr("opacity", 1);
                nodes.classed("selected", false);
                labels.attr("opacity", 0.9);
                const currentK = d3.zoomTransform(state.svg.node()).k;
                updateLabelVisibility(currentK);
                return;
            }

            const active = state.neighbors.get(centerId);

            nodes
                .classed("selected", d => d.id === centerId)
                .attr("opacity", d => active.has(d.id) ? 1 : 0.12);

            labels
                .attr("opacity", d => active.has(d.id) ? 1 : 0.08)
                .attr("visibility", d => active.has(d.id) ? "visible" : (d.landmark ? "visible" : "hidden"));
        }

        function showTooltip(event, node) {
            if (node.type !== "project") return;
            const p = node.project;
            tooltip.innerHTML = `<strong>${escapeHtml(p.name)}</strong>${escapeHtml(p.category)}<br>${escapeHtml(p.display_path || "")}`;
            tooltip.style.opacity = "1";
            tooltip.style.left = `${event.pageX + 14}px`;
            tooltip.style.top = `${event.pageY - 14}px`;
        }

        function hideTooltip() {
            tooltip.style.opacity = "0";
        }

        function projectListByCategory(category) {
            return state.filteredProjects.filter((p) => p.category === category).slice(0, 10);
        }

        function projectListByConcept(concept) {
            const key = concept.toLowerCase();
            return state.filteredProjects
                .filter((p) => [...(p.concepts || []), ...(p.tags || []), ...(p.mined_motifs || [])].some(c => c.toLowerCase() === key))
                .slice(0, 10);
        }

        function renderOverview() {
            if (state.selectedId) {
                const node = state.nodesById.get(state.selectedId);
                if (node) {
                    renderDetails(node);
                    return;
                }
            }

            const topCats = (state.interests?.top_categories || []).slice(0, 4);
            const topConcepts = (state.interests?.top_concepts || []).slice(0, 6);
            const topMined = (state.interests?.top_mined_motifs || []).slice(0, 6);
            const topMetas = (state.interests?.top_metaconstellations || []).slice(0, 6);
            const topLangs = (state.interests?.top_languages || []).slice(0, 5);
            const embed = state.interests?.embedding_coverage || { ready: 0, total: 0, pct: 0 };
            const metaHighlights = [...(state.metaconstellations || [])]
                .sort((a, b) => Number(b.project_count || 0) - Number(a.project_count || 0))
                .slice(0, 4)
                .map((m) => {
                    const desc = m.description ? ` — ${escapeHtml(m.description)}` : "";
                    return `<li><strong>${escapeHtml(m.name || "Meta")}</strong> (${Number(m.project_count || 0)})${desc}</li>`;
                })
                .join("");

            const catLine = topCats.map((c) => `${escapeHtml(c.name)} (${c.count})`).join(" • ") || "No categories yet";
            const concepts = topConcepts.map((c) => `<span class="pill">${escapeHtml(c.name)} · ${c.count}</span>`).join("");
            const mined = topMined.map((c) => `<span class="pill">${escapeHtml(c.name)} · ${c.count}</span>`).join("");
            const metas = topMetas.map((c) => `<span class="pill">${escapeHtml(c.name)} · ${c.count}</span>`).join("");
            const langs = topLangs.map((l) => `<span class="pill">${escapeHtml(l.name)} · ${l.count}</span>`).join("");

            detailsPanel.innerHTML = `
                <h2>Interest Profile</h2>
                <p>The atlas currently maps <strong>${state.filteredProjects.length}</strong> visible projects across constellations. Select a star to inspect its narrative and connective motifs.</p>
                <h3>Dominant Constellations</h3>
                <p>${catLine}</p>
                <h3>Recurring Concepts</h3>
                <div class="pill-row">${concepts || '<span class="pill">No concepts detected</span>'}</div>
                <h3>Mined Motifs</h3>
                <div class="pill-row">${mined || '<span class="pill">No mined motifs yet</span>'}</div>
                <h3>Metaconstellations</h3>
                <div class="pill-row">${metas || '<span class="pill">No metaconstellations aligned yet</span>'}</div>
                <h3>Meta Narratives</h3>
                <ul>${metaHighlights || "<li>No metaconstellation narratives yet</li>"}</ul>
                <h3>Language Weight</h3>
                <div class="pill-row">${langs || '<span class="pill">No language signals</span>'}</div>
                <p class="meta-line">Embedding coverage: ${embed.ready || 0}/${embed.total || 0} (${embed.pct || 0}%). Metaconstellations: ${(state.metaconstellations || []).length}. Tip: search, filter category, or toggle concept nodes for different strategic views.</p>
            `;
        }

        function renderDetails(node) {
            if (node.type === "project") {
                const p = node.project;
                const makePills = (arr, limit) => [...new Set(arr)].slice(0, limit).map((c) => `<span class="pill">${escapeHtml(c)}</span>`).join("");

                const conceptPills = makePills([...(p.concepts || []), ...(p.tags || [])], 12);
                const minedPills = makePills(p.mined_motifs || [], 10);
                const metaconstellationPills = projectMetaconstellationNames(p)
                    .slice(0, 8)
                    .map((m) => `<span class="pill">${escapeHtml(m)}</span>`)
                    .join("");
                const langPills = makePills(p.languages || [], 8);

                // Raw ground-truth values for comparison.
                const rawCategory = p.raw_category || p.category;
                const rawConcepts = p.raw_concepts || p.concepts || [];
                const rawTags = p.raw_tags || p.tags || [];
                const rawMined = p.raw_mined_motifs || p.mined_motifs || [];
                const hasRawCategory = rawCategory && rawCategory !== p.category;
                const rawConceptSet = [...new Set([...rawConcepts, ...rawTags])];
                const alignedConceptSet = [...new Set([...(p.concepts || []), ...(p.tags || [])])];
                const hasRawConcepts = rawConceptSet.join("|") !== alignedConceptSet.join("|");
                const hasRawMined = rawMined.join("|") !== (p.mined_motifs || []).join("|");

                const staleBadge = p.alignment_stale ? `<span class="pill" style="background:var(--accent-rust);color:#fff;font-size:0.7rem">alignment stale</span> ` : "";
                const rawCategoryLine = hasRawCategory ? `<p class="meta-line">Raw category: ${escapeHtml(rawCategory)}</p>` : "";
                const rawConceptPills = hasRawConcepts ? `<h3>Raw Concepts</h3><div class="pill-row">${makePills(rawConceptSet, 14) || '<span class="pill">None</span>'}</div>` : "";
                const rawMinedPills = hasRawMined ? `<h3>Raw Mined Motifs</h3><div class="pill-row">${makePills(rawMined, 10) || '<span class="pill">None</span>'}</div>` : "";

                const neighborItems = (p.motif_neighbors || [])
                    .slice(0, 6)
                    .map((n) => {
                        const similarity = Number.isFinite(n.similarity) ? ` · sim ${Number(n.similarity).toFixed(3)}` : "";
                        const pathSuffix = n.path ? ` <span style="color:#93a7b6">${escapeHtml(n.path)}</span>` : "";
                        return `<li>${escapeHtml(n.name || "Unnamed")}${similarity}${pathSuffix}</li>`;
                    })
                    .join("");

                const embeddingMeta = p.embedding
                    ? `${escapeHtml(p.embedding.model || "embedding")} · dim ${escapeHtml(String(p.embedding.dim || "?"))}`
                    : "No embedding metadata";

                const attrMap = {
                    "my-projects": "Ember Original",
                    "contributed": "Contributed",
                    "interests": "Workspace Interest"
                };
                const attrLabel = attrMap[p.attribution] || p.attribution;

                detailsPanel.innerHTML = `
                    <h2>${escapeHtml(p.name)}</h2>
                    <p>${escapeHtml(p.description)}</p>
                    <h3>${escapeHtml(p.category)} · <span style="color:var(--accent-gold)">${escapeHtml(attrLabel)}</span> ${staleBadge}</h3>
                    ${rawCategoryLine}
                    <div class="pill-row">${langPills || '<span class="pill">Language unknown</span>'}</div>
                    <h3>Motifs</h3>
                    <div class="pill-row">${conceptPills || '<span class="pill">No motifs extracted</span>'}</div>
                    ${rawConceptPills}
                    <h3>Mined Motifs</h3>
                    <div class="pill-row">${minedPills || '<span class="pill">No mined motifs</span>'}</div>
                    ${rawMinedPills}
                    <h3>Metaconstellations</h3>
                    <div class="pill-row">${metaconstellationPills || '<span class="pill">Unassigned</span>'}</div>
                    <h3>Semantic Neighbors</h3>
                    <ul>${neighborItems || "<li>No semantic neighbors yet</li>"}</ul>
                    <p class="meta-line">${embeddingMeta}</p>
                    <p class="meta-line">${escapeHtml(p.display_path || p._path || '')}</p>
                `;
                return;
            }

            // Concept/category nodes removed — scatter is project-only
        }

        function renderChips() {
            const topCats = (state.interests?.top_categories || []).slice(0, 5);
            const topConcepts = (state.interests?.top_concepts || []).slice(0, 7);
            const topMined = (state.interests?.top_mined_motifs || []).slice(0, 5);
            const topMetas = (state.interests?.top_metaconstellations || []).slice(0, 5);

            const chips = [];
            topCats.forEach((cat) => {
                chips.push(`<span class="chip"><strong>${escapeHtml(cat.name)}</strong> ${cat.count}</span>`);
            });
            topConcepts.forEach((concept) => {
                chips.push(`<span class="chip">${escapeHtml(concept.name)} ${concept.count}</span>`);
            });
            topMined.forEach((motif) => {
                chips.push(`<span class="chip">${escapeHtml(motif.name)} ${motif.count} mined</span>`);
            });
            topMetas.forEach((meta) => {
                chips.push(`<span class="chip">${escapeHtml(meta.name)} ${meta.count} meta</span>`);
            });

            chipsEl.innerHTML = chips.join("");
        }

        function renderHeader(generatedAt) {
            const topCats = (state.interests?.top_categories || []).slice(0, 3).map((c) => c.name);
            const embed = state.interests?.embedding_coverage || { ready: 0, total: 0, pct: 0 };
            const metaCount = (state.metaconstellations || []).length;
            if (!state.allProjects.length) {
                summaryText.textContent = "No summaries found yet. Run resummarization to seed the sky.";
                metaText.textContent = "Expected source: ~/.summarization";
                return;
            }

            summaryText.textContent = topCats.length
                ? `Strongest constellations: ${topCats.join(', ')}.`
                : "The map is live; constellation categories are still converging.";

            const dateText = generatedAt ? new Date(generatedAt).toLocaleString() : "unknown";
            metaText.textContent = `${state.allProjects.length} projects sampled • Embeddings ${embed.ready || 0}/${embed.total || 0} (${embed.pct || 0}%) • Metaconstellations ${metaCount} • Updated ${dateText}`;
        }

        function setEmpty(message, visible) {
            emptyState.textContent = message;
            emptyState.classList.toggle("visible", visible);
        }

        function setupEvents() {
            const startBtn = document.getElementById("startBtn");
            const overlay = document.getElementById("overlay");
            const audioControl = document.getElementById("audioControl");

            const viewCore = document.getElementById("viewCore");
            const viewAll = document.getElementById("viewAll");

            viewCore.addEventListener("click", () => {
                state.viewMode = "core";
                viewCore.classList.add("active");
                viewAll.classList.remove("active");
                renderGraph();
            });

            viewAll.addEventListener("click", () => {
                state.viewMode = "all";
                viewAll.classList.add("active");
                viewCore.classList.remove("active");
                renderGraph();
            });

            startBtn.addEventListener("click", () => {
                composer.init();
                overlay.classList.add("hidden");
                showToast("Synchronization sequence active", "ok");
            });

            audioControl.addEventListener("click", () => {
                const playing = composer.toggle();
                audioControl.textContent = playing ? "Mute Audio" : "Unmute Audio";
            });

            const searchClear = document.getElementById("searchClear");
            searchClear.addEventListener("click", () => {
                searchInput.value = "";
                state.searchTerm = "";
                renderGraph();
            });

            document.addEventListener("keydown", (event) => {
                if (event.key === "Escape") {
                    if (state.selectedId) {
                        state.selectedId = null;
                        applyHighlight(null);
                        renderOverview();
                    } else if (state.searchTerm) {
                        searchInput.value = "";
                        state.searchTerm = "";
                        renderGraph();
                    }
                }
            });

            searchInput.addEventListener("input", () => {
                state.searchTerm = searchInput.value;
                renderGraph();
            });

            categorySelect.addEventListener("change", () => {
                state.category = categorySelect.value;
                renderGraph();
            });

            liveToggle.addEventListener("change", () => {
                state.liveSync = liveToggle.checked;
                setSyncStatus(state.liveSync ? "Live sync online" : "Live sync paused", state.liveSync ? "ok" : "warn");
                if (state.liveSync) {
                    syncData({ manual: false, announce: true });
                }
            });

            refreshBtn.addEventListener("click", () => {
                syncData({ manual: true, announce: true });
            });

            recenterBtn.addEventListener("click", recenter);

            window.addEventListener("resize", () => {
                state.width = window.innerWidth;
                state.height = window.innerHeight;
                setupStarfield();
                if (state.allProjects.length) {
                    setupScene();
                    renderGraph();
                }
            });

            document.addEventListener("visibilitychange", () => {
                if (!document.hidden && state.liveSync) {
                    syncData({ manual: false, announce: true });
                }
            });
        }

        function startLiveSyncLoop() {
            if (state.syncTimer) {
                window.clearInterval(state.syncTimer);
            }

            state.syncTimer = window.setInterval(() => {
                if (!state.liveSync || document.hidden) {
                    return;
                }
                syncData({ manual: false, announce: true });
            }, state.syncIntervalMs);
        }

        let stars = [];
        let starCtx = null;
        function setupStarfield() {
            const canvas = document.getElementById("starfield");
            const ratio = window.devicePixelRatio || 1;
            canvas.width = Math.floor(window.innerWidth * ratio);
            canvas.height = Math.floor(window.innerHeight * ratio);
            canvas.style.width = `${window.innerWidth}px`;
            canvas.style.height = `${window.innerHeight}px`;

            starCtx = canvas.getContext("2d");
            starCtx.setTransform(ratio, 0, 0, ratio, 0, 0);

            const count = Math.max(120, Math.floor((window.innerWidth * window.innerHeight) / 9000));
            stars = Array.from({ length: count }, () => ({
                x: Math.random() * window.innerWidth,
                y: Math.random() * window.innerHeight,
                r: 0.4 + Math.random() * 1.4,
                b: 0.25 + Math.random() * 0.7,
                drift: 0.002 + Math.random() * 0.008,
            }));
        }

        function animateStarfield(t = 0) {
            nebula.render(t);
            if (!starCtx) {
                requestAnimationFrame(animateStarfield);
                return;
            }

            starCtx.clearRect(0, 0, window.innerWidth, window.innerHeight);
            stars.forEach((star, i) => {
                const pulse = 0.55 + 0.45 * Math.sin(t * star.drift + i);
                starCtx.beginPath();
                starCtx.arc(star.x, star.y, star.r, 0, Math.PI * 2);
                starCtx.fillStyle = `rgba(214, 229, 240, ${star.b * pulse})`;
                starCtx.fill();
            });

            requestAnimationFrame(animateStarfield);
        }

        async function init() {
            setupStarfield();
            animateStarfield();
            setupEvents();
            liveToggle.checked = state.liveSync;
            startLiveSyncLoop();
            await syncData({ manual: true, announce: false });
            document.body.classList.add("loaded");
        }

        init();
    </script>
</body>
